name: Build KPM

on:
  push:
    branches: [main]
    paths:
      - "hid_hide.c"
      - "hid_hide.lds"
      - "Makefile"
      - ".github/workflows/build.yml"
    tags: ["v*"]
  workflow_dispatch:

env:
  KP_REPO: bmax121/KernelPatch
  TOOLCHAIN: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout module
        uses: actions/checkout@v4

      - name: Checkout KernelPatch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KP_REPO }}
          path: KernelPatch

      - name: Install aarch64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Build
        run: |
          make TARGET_COMPILE=${{ env.TOOLCHAIN }} KP_DIR="$GITHUB_WORKSPACE/KernelPatch"
          file hid_hide.kpm
          aarch64-linux-gnu-readelf -h hid_hide.kpm | head -n 12

      # KPM 加载器解析不了任何未定义符号就会拒绝加载。
      # 只允许引用 KP 稳定导出的符号，出现其他符号（如 __stack_chk_guard、
      # libgcc 原子辅助函数）说明编译参数或代码有误，直接判失败。
      - name: Check undefined symbols
        run: |
          pip install --quiet pyelftools
          python3 - <<'EOF'
          from elftools.elf.elffile import ELFFile
          ALLOW = {
              "printk", "kallsyms_lookup_name", "compat_copy_to_user",
              "hook_wrap", "hook_unwrap_remove",
          }
          with open("hid_hide.kpm", "rb") as f:
              elf = ELFFile(f)
              symtab = elf.get_section_by_name(".symtab")
              undef = [s.name for s in symtab.iter_symbols()
                       if s["st_shndx"] == "SHN_UNDEF" and s.name]
          bad = [n for n in undef if n not in ALLOW and not n.startswith("kf_")]
          print("undefined symbols:", undef)
          if bad:
              raise SystemExit("unexpected undefined symbols: %s" % bad)
          print("symbol check passed")
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hid_hide-kpm
          path: hid_hide.kpm
          if-no-files-found: error

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" hid_hide.kpm \
            --title "hid-hide $GITHUB_REF_NAME" \
            --generate-notes
